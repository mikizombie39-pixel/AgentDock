<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Dock — 網谷水産の Adaptive Workspace</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="board.css">
</head>
<body>
<div id="stage">
  <header class="top">
    <img class="adlogo" src="agentdock-logo.png" alt="Agent Dock　水産業に、新しい仲間を。" width="256" height="40">
    <div class="title">網谷水産<small>Adaptive Workspace（磁石ボード）・若い担当者</small></div>
    <ol id="rail"></ol>
    <div class="right">
      <button id="threadbtn" class="ghost small">交渉のやり取り</button>
      <button id="speed" class="ghost small" title="動きを短くする（キー F）">動き：ふつう</button>
      <span id="mock" class="mockflag" hidden>模擬の Claude（画面の確かめ用）</span>
      <span class="scope">登場する組織と、取引の条件・値は架空です</span>
    </div>
  </header>

  <section id="net">
    <svg id="lines" width="1600" height="120"></svg>
    <div id="nodes"></div>
  </section>

  <div id="now"><span class="dot"></span><span id="nowtext">業務の出来事を待っています</span><span id="busy"></span></div>

  <section id="board"></section>

  <section id="dock">
    <div id="lead"></div>
    <div id="actions"></div>
    <form id="askbar" autocomplete="off">
      <input id="ask" maxlength="200" placeholder="Claude に聞く（例：B社との取引は本当に大丈夫？）">
      <button type="submit" id="askbtn">聞く</button>
    </form>
  </section>

  <div id="drawer" class="off"><div class="dhead"><b id="dtitle"></b><button id="dclose" class="ghost small">閉じる</button></div><div id="dbody"></div></div>
  <a id="verifylink" href="verify.html" target="_blank">技術の検証</a>
</div>
<script src="board.js"></script>
</body>
</html>
