<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Agent Dock — 技術の検証</title>
<link rel="icon" href="favicon.ico">
<style>
  body { font-family: "BIZ UDPGothic", "Yu Gothic UI", sans-serif; background: #F3EEE3; color: #27221D; margin: 20px 28px; font-size: 13px; }
  h1 { font-size: 20px; margin: 0 0 4px; } .adlogo { display: block; flex: none; height: 40px; width: auto; } h2 { font-size: 15px; margin: 22px 0 6px; border-left: 4px solid #1D6670; padding-left: 8px; }
  .note { color: #6B6156; } table { border-collapse: collapse; width: 100%; background: #FBF8F1; }
  td, th { border: 1px solid #D8CFBF; padding: 4px 7px; vertical-align: top; text-align: left; }
  th { background: #EFE8DA; font-weight: normal; color: #6B6156; }
  table.steps { table-layout: fixed; } table.steps td:nth-child(1) { width: 60px; } table.steps td:nth-child(2) { width: 200px; }
  table.steps td:nth-child(3) { width: 140px; } td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .err { color: #C62828; } .ok { color: #2E6B4F; } pre { margin: 0; white-space: pre-wrap; word-break: break-all; font-size: 12px; max-height: 120px; overflow: auto; }
  button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid #1D6670; background: #FBF8F1; color: #1D6670; cursor: pointer; }
  .bar { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
  /* 一つの取引の証拠のたどり：段ごとの見出しと、行ごとの2つの印（出所・本物か模擬か）。区別は単色の地と枠線だけ */
  .tr-step { margin: 14px 0 4px; font-weight: bold; color: #1D6670; } .tr-step small { font-weight: normal; color: #6B6156; margin-left: 8px; }
  .tr-row { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; background: #FBF8F1; border: 1px solid #D8CFBF; border-radius: 8px; padding: 7px 10px; margin: 4px 0; }
  .tr-row .t { color: #6B6156; font-variant-numeric: tabular-nums; } .tr-row .h { font-size: 14px; }
  .tr-row .l { grid-column: 2; color: #3D362F; } .tr-row details { grid-column: 2; } .tr-row summary { cursor: pointer; color: #1D6670; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; margin-left: 6px; border: 1px solid; vertical-align: 1px; }
  .k-fact { color: #2F4E6B; border-color: #2F4E6B; background: #EAF0F5; } .k-calc { color: #1D6670; border-color: #1D6670; background: #E4F0EF; }
  .k-ai { color: #7A4B12; border-color: #A86A1E; background: #F7EBD9; } .k-experience { color: #5B3F73; border-color: #5B3F73; background: #EFE8F4; }
  .k-human { color: #27221D; border-color: #27221D; background: #FFFFFF; }
  .o-real { color: #FFFFFF; border-color: #2E6B4F; background: #2E6B4F; } .o-mock { color: #7A4B12; border-color: #A86A1E; background: #FFFFFF; }
  .o-person, .o-code, .o-record { color: #6B6156; border-color: #B8AD9C; background: #FFFFFF; }
  .tr-step-box { max-width: 1100px; }
</style>
</head>
<body>
<h1 style="display:flex;align-items:center;gap:16px"><img class="adlogo" src="agentdock-logo.png" alt="Agent Dock　水産業に、新しい仲間を。" width="256" height="40">技術の検証<a href="coop.html" style="font-size:12px;font-weight:normal;margin-left:auto;color:#1D6670">岩瀬漁協の AI の仕事</a></h1>
<div class="note">Claude の起動と道具の呼び出し、市場の取引帳簿の API と登録の結果、帳簿の照合、費用を、DB の記録から表示します。
  市場の取引帳簿と API は会期中に新しく作った部品です（既存の業務システムへの接続は今回は行っていません）。</div>
<div class="bar">
  <select id="variant"><option value="normal">通常</option><option value="price_up">漁協の値上がり</option><option value="b_declines">B社の注文の取り消し</option><option value="vault_changed">順風満帆の休業</option></select>
  <button id="start">業務を始める（漁協の資料と注文を入れる）</button>
  <button id="resume">止まった通しを再開する</button>
  <span id="msg" class="note"></span>
</div>
<div id="trace"></div>
<div id="out">読み込み中…</div>
<script>
(function () {
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const yen = (v) => (v === null || v === undefined) ? "—" : `${Number(v).toLocaleString("ja-JP")}円`;
  const table = (head, rows, cls = "") => `<table class="${cls}"><tr>${head.map((h) => `<th>${h}</th>`).join("")}</tr>${rows.join("")}</table>`;
  // 一つの取引の証拠のたどり（GET /api/trace）。開いた起動の詳細は、読み直しても開いたままにする
  const OPEN = new Set();
  let lastTrace = "";
  document.getElementById("trace").addEventListener("toggle", (e) => {
    const k = e.target.dataset && e.target.dataset.k;
    if (k) { if (e.target.open) OPEN.add(k); else OPEN.delete(k); }
  }, true);
  async function loadTrace() {
    const t = await (await fetch("/api/trace?owner=amiya")).json().catch(() => null);
    const key = JSON.stringify(t);
    if (!t || key === lastTrace) return;
    lastTrace = key;
    const box = document.getElementById("trace");
    if (!t.case_id) { box.innerHTML = `<h2>一つの取引の証拠のたどり</h2><div class="note">${esc(t.note || "登録した取引はまだありません")}</div>`; return; }
    let html = `<h2>一つの取引の証拠のたどり（案件 ${t.case_id}・${esc(t.item.name)}）</h2>
      <div class="note">登録した取引から、決定・案・根拠・Claude の起動・相手とのやり取り・市場の帳簿・在庫までを、業務 DB と市場の記録の行で並べます。
        印：出所（${Object.values(t.kind_labels).map(esc).join("・")}）と、誰が作ったか（${Object.values(t.origin_labels).map(esc).join("・")}）。
        この取引の AI：${t.ai_origins.length ? t.ai_origins.map(esc).join("・") : "なし"}</div><div class="tr-step-box">`;
    let step = 0;
    for (const r of t.rows) {
      if (r.step !== step) { step = r.step; html += `<div class="tr-step">${step}. ${esc(r.step_label)}</div>`; }
      const ref = r.ref ? `<small class="note">（${esc(r.ref.db)}.${esc(r.ref.table)} ${esc(r.ref.id)}）</small>` : "";
      const k = r.ref ? `${r.ref.db}.${r.ref.table}.${r.ref.id}` : "";
      const steps = (r.steps || []).length ? `<details data-k="${esc(k)}" ${OPEN.has(k) ? "open" : ""}><summary>道具の入力と結果を見る（${r.steps.length}件・${r.origin === "real" ? esc(r.model || "") : "模擬の AI（Claude は呼んでいません）"}）</summary>
        ${table(["順", "道具", "入力", "結果（先頭 400字）"], r.steps.map((s) => `<tr><td class="num">${s.seq}</td><td class="${s.is_error ? "err" : ""}">${esc(s.tool)}</td><td><pre>${esc(s.input)}</pre></td><td><pre>${esc(s.result)}</pre></td></tr>`), "steps")}</details>` : "";
      html += `<div class="tr-row"><div class="t">${esc((r.at || "").slice(11, 19)) || "—"}</div>
        <div class="h">${esc(r.title)}<span class="tag k-${esc(r.kind)}">${esc(r.kind_label)}</span><span class="tag o-${esc(r.origin)}">${esc(r.origin_label)}</span>${ref}</div>
        ${r.lines.map((l) => `<div class="l">${esc(l)}</div>`).join("")}${steps}</div>`;
    }
    document.getElementById("trace").innerHTML = html + "</div>";
  }
  async function load() {
    loadTrace();
    const v = await (await fetch("/api/verify?owner=amiya")).json();
    const w = v.worker;
    const runs = v.runs.map((r) => `<tr><td class="num">${r.id}</td><td>${esc(r.event_kind)}</td><td>${esc(r.started_at)}</td><td>${esc(r.ended_at)}</td>
      <td class="${["error", "max_turns", "refusal"].includes(r.outcome) ? "err" : ""}">${esc(r.outcome)}</td><td>${esc(r.run_kind)}・${esc(r.model)}</td><td>${esc((r.summary || "").slice(0, 160))}</td></tr>`);
    const steps = v.steps.map((s) => `<tr><td class="num">${s.run_id}-${s.seq}</td><td>${esc(s.at)}</td><td class="${s.is_error ? "err" : ""}">${esc(s.tool)}</td>
      <td><pre>${esc(s.input_json)}</pre></td><td><pre>${esc(s.result_text)}</pre></td></tr>`);
    const api = v.market_api.map((a) => `<tr><td>${esc(a.at)}</td><td>${esc(a.trade_id)}</td><td>${esc((a.calls || []).join(" → "))}</td><td>${esc(a.status)}</td>
      <td class="${a.seller_booked && a.buyer_booked ? "ok" : "err"}">${a.seller_booked ? "売り手○" : "売り手×"}・${a.buyer_booked ? "買い手○" : "買い手×"}</td></tr>`);
    const trades = v.trades.map((t) => `<tr><td>${esc(t.trade_id)}</td><td>${esc(t.seller)} → ${esc(t.buyer)}</td><td class="num">${t.quantity}${esc(t.unit)}</td>
      <td class="num">${yen(t.unit_price_yen)}</td><td>${esc(t.status)}</td><td>${esc(t.created_at)}</td></tr>`);
    const rec = v.reconcile.map((r) => `<tr><td>${esc(r.trade_id)}</td><td>${esc(r.status)}</td><td class="${r.seller_booked && r.buyer_booked ? "ok" : "err"}">${r.seller_booked && r.buyer_booked ? "両方の帳簿にあります" : "片側だけ・要照合"}</td></tr>`);
    document.getElementById("out").innerHTML = `
      <h2>実演の通し</h2><div>${w ? `呼び出し ${w.total_calls}／上限 ${w.max_total_calls}・${w.run_kind}・${w.running ? "動作中" : "停止"}${w.error ? `・<span class="err">${esc(w.error)}</span>` : ""}` : "このサーバーは本物の Claude を起こしません（--real なし）"}
        ・費用の記録 ${v.spent_usd.toFixed(3)}ドル・記録の置き場 ${esc(v.data_dir)}</div>
      <h2>Claude の起動（網谷水産）</h2>${table(["番号", "出来事", "開始", "終了", "結果", "種類", "まとめ"], runs)}
      <h2>道具の呼び出し（網谷水産・本物の Claude が選んだ道具と、コードの実行の結果）</h2>${table(["起動-順", "時刻", "道具", "入力", "結果（先頭 400字）"], steps, "steps")}
      <h2>市場の取引帳簿の API（承認の後に Agent Dock が呼んだもの）</h2>${table(["時刻", "取引", "呼んだ API", "登録の後の状態", "帳簿"], api)}
      <h2>市場の取引帳簿（網谷水産が当事者の取引）</h2>${table(["取引", "売り手 → 買い手", "数量", "単価", "状態", "登録"], trades)}
      <h2>帳簿の照合</h2>${table(["取引", "状態", "照合"], rec)}`;
  }
  async function post(url, body) {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({}));
    document.getElementById("msg").textContent = r.ok ? "受け付けました" : (j.detail || j.error || "受け付けられませんでした");
    load();
  }
  document.getElementById("start").onclick = () => post("/api/start", { variant: document.getElementById("variant").value });
  document.getElementById("resume").onclick = () => post("/api/worker/resume");
  load(); setInterval(load, 3000);
})();
</script>
</body>
</html>
